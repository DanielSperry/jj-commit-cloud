syntax = "proto3";

package commit_cloud.op_store;

// Operation log, repository view, and operation-head coordination service
// backing `jj_lib::op_store::OpStore` and
// `jj_lib::op_heads_store::OpHeadsStore`.
//
// Ordering & Isolation Contract:
// - Clients MUST persist `WriteView` before `WriteOperation`, and
// `WriteOperation` before
//   publishing `new_op_head_id` via `UpdateOpHeads`.
// - `WriteView` and `WriteOperation` are deterministic, idempotent
// content-addressed writes.
// - `UpdateOpHeads` executes under serializable isolation, removing
// `old_op_head_ids` and
//   adding `new_op_head_id` while retaining concurrent sibling operation heads.
//
// Status Codes:
// - `NOT_FOUND`: `repo_id` is unregistered, or requested `view_id` /
// `operation_id` is absent.
// - `FAILED_PRECONDITION`: `WriteOperation` references an unpersisted
// `view_id`, or
//   `UpdateOpHeads` references an unpersisted `new_op_head_id`.
// - `INVALID_ARGUMENT`: Malformed hex prefix or missing message payload.
service OpStoreService {
  // Reads an operation node by 16-byte `operation_id`. Synthesizes the all-zero
  // root operation.
  rpc ReadOperation(ReadOperationRequest) returns (ReadOperationResponse);

  // Persists an operation node and returns its deterministic 16-byte
  // `operation_id`. Idempotent.
  rpc WriteOperation(WriteOperationRequest) returns (WriteOperationResponse);

  // Resolves a hexadecimal `OperationId` prefix to zero, one, or multiple
  // (ambiguous) matches.
  rpc ResolveOperationPrefix(ResolveOperationPrefixRequest)
      returns (ResolveOperationPrefixResponse);

  // Reads a repository `View` snapshot by 16-byte `view_id`. Synthesizes the
  // all-zero root view.
  rpc ReadView(ReadViewRequest) returns (ReadViewResponse);

  // Persists a `View` snapshot using key-sorted canonical hashing and returns
  // its 16-byte `view_id`.
  rpc WriteView(WriteViewRequest) returns (WriteViewResponse);

  // Returns the active operation head IDs for `repo_id` (defaults to
  // `[ROOT_OPERATION_ID]` on init).
  rpc GetOpHeads(GetOpHeadsRequest) returns (GetOpHeadsResponse);

  // Atomically advances operation heads from `old_op_head_ids` to
  // `new_op_head_id`, preserving concurrent sibling heads for 3-way
  // reconciliation.
  rpc UpdateOpHeads(UpdateOpHeadsRequest) returns (UpdateOpHeadsResponse);

  // Reconciles divergent operation heads on the server using `jj_lib`'s 3-way
  // view and tree merge algebra under strict compare-and-swap isolation,
  // returning the single resolved `op_head`. No-op when `repo_id` already has a
  // single operation head.
  rpc ReconcileOpHeads(ReconcileOpHeadsRequest)
      returns (ReconcileOpHeadsResponse);

  // Persists a `View`, its referencing `Operation`, and an `UpdateOpHeads`
  // transition in a single roundtrip. Idempotent on retry when `View` and
  // `Operation` content is unchanged.
  rpc PublishOperation(PublishOperationRequest)
      returns (PublishOperationResponse);
}

message ReadOperationRequest {
  string repo_id = 1;
  bytes operation_id = 2;
}

message ReadOperationResponse {
  Operation operation = 1;
}

message WriteOperationRequest {
  string repo_id = 1;
  Operation operation = 2;
}

message WriteOperationResponse {
  bytes operation_id = 1;
}

enum PrefixResolutionStatus {
  PREFIX_RESOLUTION_STATUS_UNSPECIFIED = 0;
  PREFIX_RESOLUTION_NO_MATCH = 1;
  PREFIX_RESOLUTION_SINGLE_MATCH = 2;
  PREFIX_RESOLUTION_AMBIGUOUS_MATCH = 3;
}

message ResolveOperationPrefixRequest {
  string repo_id = 1;
  // Lowercase hexadecimal prefix string (0 to 32 hex characters).
  string hex_prefix = 2;
}

message ResolveOperationPrefixResponse {
  PrefixResolutionStatus status = 1;
  // Populated when `status == PREFIX_RESOLUTION_SINGLE_MATCH`.
  bytes matched_operation_id = 2;
}

message ReadViewRequest {
  string repo_id = 1;
  bytes view_id = 2;
}

message ReadViewResponse {
  bytes view_id = 1;
  View view = 2;
}

message WriteViewRequest {
  string repo_id = 1;
  View view = 2;
}

message WriteViewResponse {
  bytes view_id = 1;
}

message GetOpHeadsRequest {
  string repo_id = 1;
}

message GetOpHeadsResponse {
  repeated bytes op_head_ids = 1;
}

message UpdateOpHeadsRequest {
  string repo_id = 1;
  repeated bytes old_op_head_ids = 2;
  bytes new_op_head_id = 3;
}

message UpdateOpHeadsResponse {
  repeated bytes current_op_head_ids = 1;
}

message ReconcileOpHeadsRequest {
  string repo_id = 1;
}

message ReconcileOpHeadsResponse {
  bytes op_head = 1;
}

message PublishOperationRequest {
  string repo_id = 1;
  View view = 2;
  Operation operation = 3;
  repeated bytes old_op_head_ids = 4;
}

message PublishOperationResponse {
  bytes view_id = 1;
  bytes operation_id = 2;
  repeated bytes current_op_head_ids = 3;
}

// Operation metadata. `attributes` map keys are sorted server-side before
// hashing.
message OperationMetadata {
  int64 start_time_millis = 1;
  int64 end_time_millis = 2;
  string description = 3;
  bool is_snapshot = 4;
  optional string workspace_name = 5;
  string hostname = 6;
  string username = 7;
  map<string, string> attributes = 8;
}

message CommitPredecessors {
  bytes commit_id = 1;
  repeated bytes predecessor_ids = 2;
}

message Operation {
  bytes view_id = 1;
  repeated bytes parents = 2;
  OperationMetadata metadata = 3;
  repeated CommitPredecessors commit_predecessors = 4;
  bool commit_predecessors_set = 5;
}

message RefTargetTerm {
  bytes commit_id = 1;
}

message RefTarget {
  repeated RefTargetTerm removes = 1;
  repeated RefTargetTerm adds = 2;
}

message RemoteRef {
  RefTarget target = 1;
  bool is_tracked = 2;
}

// Repository state snapshot. Map fields are hashed in deterministic key-sorted
// order by the server.
message View {
  repeated bytes head_ids = 1;
  map<string, bytes> wc_commit_ids = 2;
  map<string, RefTarget> local_bookmarks = 3;
  map<string, RemoteRef> remote_bookmarks = 4;
}
