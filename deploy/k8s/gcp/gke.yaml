# Template manifest rendered and applied by `cargo xtask up gke --project <PROJECT_ID>`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jj-cc-server-ksa
  annotations:
    iam.gke.io/gcp-service-account: "__GCP_SERVICE_ACCOUNT__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jj-cc-server
  labels:
    app: jj-cc-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jj-cc-server
  template:
    metadata:
      labels:
        app: jj-cc-server
    spec:
      serviceAccountName: jj-cc-server-ksa
      containers:
        - name: jj-cc-server
          image: "__IMAGE_URI__"
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: STORE_TYPE
              value: "spanner"
            - name: SPANNER_DATABASE
              value: "__SPANNER_DATABASE__"
            - name: BLOB_STORE
              value: "gcs"
            - name: GCS_BUCKET
              value: "__GCS_BUCKET__"
            - name: GCS_PEER_BUCKETS
              value: "__GCS_PEER_BUCKETS__"
          ports:
            - name: grpc
              containerPort: 8080
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: ClusterIP
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
