[package]
name = "jj-commit-cloud-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "jj_commit_cloud_daemon"
path = "src/lib.rs"

[dependencies]
bytes = "1"
cc-common = { path = "../common" }
hex = "0.4"
lru = "0.16.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tonic = { version = "0.12.3", features = ["tls-roots"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
