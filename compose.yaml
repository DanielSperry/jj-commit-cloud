# Cross-platform Docker / Podman Compose profiles for local jj-commit-cloud testing:
#   docker compose --profile memory up -d --build
#   docker compose --profile sqlite up -d --build
#   docker compose --profile spanner up -d --build
#   docker compose --profile multiregion up -d --build
#   docker compose run --rm smoke
#   docker compose down -v

services:
  server-memory:
    build:
      context: .
      target: server
    image: jj-cc-server:local
    profiles: ["memory"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STORE_TYPE: "memory"
      BLOB_STORE: "memory"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - jj-cc-server

  server-sqlite:
    build:
      context: .
      target: server
    image: jj-cc-server:local
    profiles: ["sqlite"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STORE_TYPE: "sqlite"
      BLOB_STORE: "local"
      SQLITE_PATH: "/data/commit_cloud.db"
      BLOB_PATH: "/data/blobs"
    volumes:
      - jj-cc-sqlite-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - jj-cc-server

  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    profiles: ["spanner", "multiregion"]
    ports:
      - "127.0.0.1:9010:9010"
      - "127.0.0.1:9020:9020"

  gcs-emulator:
    image: docker.io/fsouza/fake-gcs-server:latest
    profiles: ["spanner", "multiregion"]
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-external-url"
      - "http://gcs-emulator:4443"
      - "-backend"
      - "memory"
    ports:
      - "127.0.0.1:4443:4443"

  server-spanner:
    build:
      context: .
      target: server
    image: jj-cc-server:local
    profiles: ["spanner"]
    depends_on:
      - spanner-emulator
      - gcs-emulator
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STORE_TYPE: "spanner"
      SPANNER_EMULATOR_HOST: "spanner-emulator:9010"
      SPANNER_EMULATOR_REST_HOST: "http://spanner-emulator:9020"
      SPANNER_DATABASE: "projects/local-project/instances/local-instance/databases/commit-cloud"
      SPANNER_AUTO_MIGRATE: "true"
      BLOB_STORE: "gcs"
      STORAGE_EMULATOR_HOST: "http://gcs-emulator:4443"
      GCS_BUCKET: "gs://blobs-uc1"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - jj-cc-server

  server-us:
    build:
      context: .
      target: server
    image: jj-cc-server:local
    profiles: ["multiregion"]
    depends_on:
      - spanner-emulator
      - gcs-emulator
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STORE_TYPE: "spanner"
      SPANNER_EMULATOR_HOST: "spanner-emulator:9010"
      SPANNER_EMULATOR_REST_HOST: "http://spanner-emulator:9020"
      SPANNER_DATABASE: "projects/local-project/instances/local-instance/databases/commit-cloud"
      SPANNER_AUTO_MIGRATE: "true"
      BLOB_STORE: "gcs"
      STORAGE_EMULATOR_HOST: "http://gcs-emulator:4443"
      GCS_BUCKET: "gs://blobs-uc1"
      GCS_PEER_BUCKETS: "gs://blobs-ew1"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      default:
        aliases:
          - jj-cc-server

  server-eu:
    build:
      context: .
      target: server
    image: jj-cc-server:local
    profiles: ["multiregion"]
    depends_on:
      - spanner-emulator
      - gcs-emulator
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STORE_TYPE: "spanner"
      SPANNER_EMULATOR_HOST: "spanner-emulator:9010"
      SPANNER_EMULATOR_REST_HOST: "http://spanner-emulator:9020"
      SPANNER_DATABASE: "projects/local-project/instances/local-instance/databases/commit-cloud"
      SPANNER_AUTO_MIGRATE: "true"
      BLOB_STORE: "gcs"
      STORAGE_EMULATOR_HOST: "http://gcs-emulator:4443"
      GCS_BUCKET: "gs://blobs-ew1"
      GCS_PEER_BUCKETS: "gs://blobs-uc1"
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      default:
        aliases:
          - jj-cc-peer

  smoke:
    build:
      context: .
      target: cli
    image: jj-cc-cli:local
    profiles: ["smoke"]
    entrypoint: ["xtask"]
    command:
      - "smoke"
      - "--jj-bin"
      - "/usr/local/bin/jj"
      - "--server"
      - "${SMOKE_SERVER_URL:-http://jj-cc-server:8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jj-cc-sqlite-data:
