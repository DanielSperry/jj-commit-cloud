apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jj-cc-sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: jj-cc-sqlite
  labels:
    app: jj-cc-server
    mode: sqlite
spec:
  securityContext:
    fsGroup: 65534
  containers:
    - name: jj-cc-server
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: STORE_TYPE
          value: "sqlite"
        - name: BLOB_STORE
          value: "local"
        - name: SQLITE_PATH
          value: "/data/commit_cloud.db"
        - name: BLOB_PATH
          value: "/data/blobs"
      volumeMounts:
        - name: data
          mountPath: /data
      ports:
        - containerPort: 8080
          hostIP: 127.0.0.1
          hostPort: 8080
          protocol: TCP
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: jj-cc-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: NodePort
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      nodePort: 30080
