apiVersion: v1
kind: Pod
metadata:
  name: jj-cc-multiregion
  labels:
    app: jj-cc-multiregion
    mode: multiregion
spec:
  containers:
    - name: spanner-emulator
      image: gcr.io/cloud-spanner-emulator/emulator:latest
      ports:
        - containerPort: 9010
        - containerPort: 9020
    - name: gcs-emulator
      image: docker.io/fsouza/fake-gcs-server:latest
      args:
        - "-scheme"
        - "http"
        - "-port"
        - "4443"
        - "-external-url"
        - "http://127.0.0.1:4443"
        - "-backend"
        - "memory"
      ports:
        - containerPort: 4443
    - name: server-us
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8081"
        - name: STORE_TYPE
          value: "spanner"
        - name: SPANNER_EMULATOR_HOST
          value: "127.0.0.1:9010"
        - name: SPANNER_EMULATOR_REST_HOST
          value: "http://127.0.0.1:9020"
        - name: SPANNER_DATABASE
          value: "projects/local-project/instances/local-instance/databases/commit-cloud"
        - name: SPANNER_AUTO_MIGRATE
          value: "true"
        - name: BLOB_STORE
          value: "gcs"
        - name: STORAGE_EMULATOR_HOST
          value: "http://127.0.0.1:4443"
        - name: GCS_BUCKET
          value: "gs://blobs-uc1"
        - name: GCS_PEER_BUCKETS
          value: "gs://blobs-ew1"
      ports:
        - containerPort: 8081
          hostIP: 127.0.0.1
          hostPort: 8081
          protocol: TCP
    - name: server-eu
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8082"
        - name: STORE_TYPE
          value: "spanner"
        - name: SPANNER_EMULATOR_HOST
          value: "127.0.0.1:9010"
        - name: SPANNER_EMULATOR_REST_HOST
          value: "http://127.0.0.1:9020"
        - name: SPANNER_DATABASE
          value: "projects/local-project/instances/local-instance/databases/commit-cloud"
        - name: SPANNER_AUTO_MIGRATE
          value: "true"
        - name: BLOB_STORE
          value: "gcs"
        - name: STORAGE_EMULATOR_HOST
          value: "http://127.0.0.1:4443"
        - name: GCS_BUCKET
          value: "gs://blobs-ew1"
        - name: GCS_PEER_BUCKETS
          value: "gs://blobs-uc1"
      ports:
        - containerPort: 8082
          hostIP: 127.0.0.1
          hostPort: 8082
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-multiregion
spec:
  type: NodePort
  selector:
    app: jj-cc-multiregion
  ports:
    - name: grpc-us
      port: 8081
      targetPort: 8081
      nodePort: 30081
    - name: grpc-eu
      port: 8082
      targetPort: 8082
      nodePort: 30082
