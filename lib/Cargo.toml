[package]
name = "cc-lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jj-lib = "0.43.0"
async-trait = "0.1"
futures = "0.3"
gix = "0.85.0"
hex = "0.4"
cc-common = { path = "../common" }
tonic = { version = "0.12.3", features = ["tls-roots"] }
tokio = { version = "1.39", features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
