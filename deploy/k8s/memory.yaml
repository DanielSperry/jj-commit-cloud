apiVersion: v1
kind: Pod
metadata:
  name: jj-cc-memory
  labels:
    app: jj-cc-server
    mode: memory
spec:
  containers:
    - name: jj-cc-server
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: STORE_TYPE
          value: "memory"
        - name: BLOB_STORE
          value: "memory"
      ports:
        - containerPort: 8080
          hostIP: 127.0.0.1
          hostPort: 8080
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: NodePort
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      nodePort: 30080
